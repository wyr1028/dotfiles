# 键盘背光静态白。绿通道偏弱，所以红蓝取 120。
RGB=120,255,120
# 固定亮度（AUTO_BRIGHTNESS=1 时忽略）
BRIGHTNESS=100
# 亮度上限 100
# 按行补偿（row0=键盘最底部，脚本内部已翻转）
TOP_SHIFT=-24
BOTTOM_SHIFT=24

# --- 自动亮度（按时间，本机没有环境光传感器）---
AUTO_BRIGHTNESS=1
DAY_BRIGHTNESS=100
NIGHT_BRIGHTNESS=45
# 白天开始/夜间开始（24 小时制），支持跨午夜
DAY_START=8
NIGHT_START=23

# 是否把当前设置写入键盘控制器 NVRAM（每次运行都写会磨损，默认关）
SAVE=0
