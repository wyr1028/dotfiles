# ===== Kitty 配置：单窗口模式 + 常用快捷键 =====
# 目标：不用标签页（tabs），全部用窗口（windows）和 OS 窗口。

# ---------- 隐藏/禁用标签栏 ----------
tab_bar_style hidden
tab_bar_show_new_tab_button no
# 标签栏至少 2 个标签才显示；这里已经 hidden，双保险
tab_bar_min_tabs 999

# 禁用 Kitty 的标签页快捷键，避免误开标签
map ctrl+shift+t no_op
map ctrl+shift+q no_op
map ctrl+shift+. no_op
map ctrl+shift+, no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map kitty_mod+alt+t no_op

# ---------- 窗口 / OS 窗口 ----------
# 关闭 OS 窗口时不再提示「仍有程序在运行」
confirm_os_window_close 0
# 新窗口（继承当前目录）
map ctrl+shift+enter new_window_with_cwd
# 新 OS 窗口
map ctrl+shift+n new_os_window_with_cwd
# 关闭当前窗口
map ctrl+shift+w close_window
# 在窗口间切换（因为不用标签页，方向键直接切窗口）
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+right next_window
map ctrl+shift+left previous_window

# ---------- 剪贴板 ----------
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
copy_on_select no

# ---------- 字号 ----------
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# ---------- 滚动 / 搜索 ----------
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+/ search_scrollback

# ---------- 全屏 ----------
map ctrl+shift+f11 toggle_fullscreen

# ---------- 体验 ----------
enable_audio_bell no
window_padding_width 8

# ===== Tokyo Night 配色（与 pi 的 tokyonight 主题一致） =====
foreground            #c0caf5
background            #1a1b26
cursor                #c0caf5
cursor_text_color     #1a1b26
selection_foreground  #c0caf5
selection_background  #283457
url_color             #7dcfff

# 边框 / 标题栏
active_border_color   #7aa2f7
inactive_border_color #545c7e
bell_border_color     #e0af68
wayland_titlebar_color background

# 16 色
color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# 滚动条
scrollbar scrolled
scrollbar_handle_color #7aa2f7
scrollbar_track_color  #24283b
scrollbar_handle_opacity 0.7

# 字体（系统中已安装 JetBrains Mono Nerd Font）
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# 标签栏配色（当前隐藏，以后若开启也保持一致）
tab_bar_background      #16161e
active_tab_background   #24283b
active_tab_foreground   #c0caf5
inactive_tab_background #1a1b26
inactive_tab_foreground #565f89
active_tab_font_style   bold
inactive_tab_font_style normal
